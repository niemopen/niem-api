plugins {
  id 'application'
	id 'java'
  id 'groovy'
  id "com.github.ben-manes.versions" version "0.52.0"
  id "io.freefair.lombok" version "8.14"
	id 'io.spring.dependency-management' version '1.1.7'
  id 'org.springdoc.openapi-gradle-plugin' version '1.9.0'
	id 'org.springframework.boot' version '4.0.0-RC2'
  id 'checkstyle'
}

group = 'gov.niem.tools'
version = '2.0'
project.ext.draft = '2.0-alpha08.1'

application {
  mainClass = 'gov.niem.tools.api.Application'
}

java {
  sourceCompatibility = JavaVersion.VERSION_21
}

// subprojects {
//   apply plugin: 'java'
//   java {
//     sourceCompatibility = JavaVersion.VERSION_17
//   }
//   test {
//     // enabled = false
//   	useJUnitPlatform()
//   }
//   dependencies {
//     testImplementation 'org.junit.jupiter:junit-jupiter'
//   }
// }

springBoot {
  mainClass = 'gov.niem.tools.api.Application'
}

repositories {
	mavenCentral()
}

dependencies {

  implementation project(':app-cmftool')
  implementation project(':app-scheval')
  implementation project(':lib-cmf')
  implementation project(':lib-util')

  implementation platform('org.hibernate.search:hibernate-search-platform-bom:8.1.2.Final')

  implementation 'com.fasterxml.jackson.core:jackson-core'
  implementation 'com.fasterxml.jackson.core:jackson-databind'
  implementation 'com.fasterxml.jackson.dataformat:jackson-dataformat-xml'
  implementation 'com.fasterxml.jackson.dataformat:jackson-dataformat-csv'
  implementation 'com.fasterxml.jackson.dataformat:jackson-dataformats-text:2.19.0'
  implementation 'com.fasterxml.jackson.datatype:jackson-datatype-hibernate7:2.20.0-rc1'
  implementation 'com.fasterxml.jackson:jackson-bom'

  implementation 'com.github.therapi:therapi-runtime-javadoc:0.15.0'

  implementation 'commons-io:commons-io:2.20.0'

  implementation 'net.lingala.zip4j:zip4j:2.11.5'

  implementation 'net.sf.saxon:Saxon-HE:12.8'

  implementation 'org.apache.commons:commons-csv:1.14.1'

  implementation 'org.apache.lucene:lucene-backward-codecs'

  implementation 'org.hibernate.orm:hibernate-envers'

  implementation 'org.hibernate.search:hibernate-search-mapper-orm'
  implementation 'org.hibernate.search:hibernate-search-backend-lucene'

  implementation 'org.json:json:20250517'

  implementation 'org.postgresql:postgresql'

  implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.8.9'

  implementation 'org.springframework.boot:spring-boot-starter-actuator'
  implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
  // implementation 'org.springframework.boot:spring-boot-starter-security'
  implementation 'org.springframework.boot:spring-boot-starter-validation'
  implementation 'org.springframework.boot:spring-boot-starter-web'

  // Saxon dependency is missing at runtime and needs to be included explicitly
  implementation 'org.xmlresolver:xmlresolver:6.0.14'

	developmentOnly 'org.springframework.boot:spring-boot-devtools'

	annotationProcessor 'org.springframework.boot:spring-boot-configuration-processor'

  annotationProcessor 'com.github.therapi:therapi-runtime-javadoc-scribe:0.15.0'

	testImplementation 'org.springframework.boot:spring-boot-starter-test'
}

compileJava {
  // options.compilerArgs += ['-parameters', '-Xlint:deprecation']
  options.compilerArgs.add('-parameters')
  options.compilerArgs.add('-Xlint:deprecation')
  options.compilerArgs.add('-Xlint:path')
  options.encoding = 'UTF-8'
}

configurations {
	compileOnly {
		extendsFrom annotationProcessor
	}
  testImplementation {
    exclude group: 'com.vaadin.external.google', module: 'android-json'
  }
}

configurations.all {
  resolutionStrategy {
    resolutionStrategy.force 'io.smallrye:jandex:3.1.2'

    // CMF Tool is on version 12.5
    resolutionStrategy.force 'net.sf.saxon:Saxon-HE:12.8'

    resolutionStrategy.force 'org.xmlresolver:xmlresolver:6.0.14'
    // failOnVersionConflict()
  }
}

processResources {
  filesMatching(['application.yaml', 'swagger-config.yaml']) {
    // Make application version available to the code and open-api file
    expand(project.properties)
  }
}

test {
	useJUnitPlatform()
}

// CHECKSTYLE SUPPORT *************************************

checkstyle {
  // https://checkstyle.sourceforge.io/version/9.3/
  println "Checkstyle version " + checkstyle.toolVersion
  toolVersion = "9.3"
}

checkstyleMain {
  source = 'src/main/java/gov/niem/tools/api'
}

checkstyleTest {
  source = 'src/test'
}

// JAVADOC SUPPORT ****************************************

javadoc {
  source = sourceSets.main.allJava
  options.tags = ["todo", "example"]
  options.addStringOption('Xdoclint:missing', '-quiet')
  // options.addStringOption('Xdoclint:none', '-quiet')
  options.destinationDirectory = file("/docs/javadoc")
  // include("gov/niem/tools/api/**")
  exclude "org/mitre/**", "**libs/**"
  println "IN JAVADOC TASK"
}

// task copyJavadocs(type: Copy) {
